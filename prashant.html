<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee List</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
  main { max-width: 900px; margin: 20px auto; padding: 0 10px; }
  input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
  th { background: #34495e; color: white; }
  tr:nth-child(even) { background: #f2f2f2; }
  footer { text-align: center; font-size: 12px; color: #777; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>Employee List</h1>
  <p>Name, Post and Date of Joining</p>
</header>

<main>
  <input type="text" id="search" placeholder="Search by name or post..." onkeyup="searchTable()">

  <div class="table-wrap">
    <table id="empTable">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Name</th>
          <th>Post</th>
          <th>Date of Joining</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>Rahul Sharma</td><td>Manager</td><td>15-01-2020</td></tr>
        <tr><td>2</td><td>Priya Singh</td><td>Accountant</td><td>03-06-2021</td></tr>
        <tr><td>3</td><td>Amit Verma</td><td>Clerk</td><td>10-09-2022</td></tr>
        <tr><td>4</td><td>Neha Gupta</td><td>HR Executive</td><td>21-02-2023</td></tr>
        <tr><td>5</td><td>Suresh Kumar</td><td>Peon</td><td>05-11-2019</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  Made by Prashant Kumar Thakur (29195)
</footer>

<script>
  function searchTable() {
    var text = document.getElementById("search").value.toLowerCase();
    var rows = document.querySelectorAll("#empTable tbody tr");
    for (var i = 0; i < rows.length; i++) {
      rows[i].style.display = rows[i].innerText.toLowerCase().includes(text) ? "" : "none";
    }
  }
</script>

</body>
</html>
